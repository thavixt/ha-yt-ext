<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Play on TV: Settings</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { max-width: 560px; margin: 40px auto; padding: 0 16px; line-height: 1.4; }
    h1 { font-size: 1.3rem; display: flex; align-items: center; gap: 10px; }
    h1 img { width: 28px; height: 28px; }
    fieldset { border: 1px solid #8884; border-radius: 8px; margin: 20px 0 0; padding: 4px 16px 16px; }
    legend { font-weight: 700; padding: 0 6px; }
    label { display: block; margin-top: 14px; font-weight: 600; font-size: .9rem; }
    .hint { font-weight: 400; opacity: .7; font-size: .8rem; }
    input[type=text], input[type=url], input[type=password] {
      width: 100%; box-sizing: border-box; padding: 8px 10px; margin-top: 4px;
      font: inherit; border: 1px solid #8886; border-radius: 6px; background: transparent;
    }
    input::placeholder { opacity: .45; }
    .check { display: flex; gap: 8px; align-items: center; font-weight: 400; }
    .buttons { margin-top: 24px; display: flex; gap: 8px; }
    .buttons .spacer { flex: 1; }
    button { font: inherit; padding: 8px 16px; border-radius: 6px; border: 1px solid #8886; cursor: pointer; background: transparent; }
    button.primary { background: #03a9f4; color: #fff; border-color: #03a9f4; }
    #status { margin-top: 16px; min-height: 1.4em; font-size: .9rem; }
    #status.ok { color: #1e8e3e; }
    #status.err { color: #d93025; }
  </style>
</head>
<body>
  <h1><img src="icons/icon192.png" alt="">Play on TV: Settings</h1>
  <p class="hint">Empty fields use the default shown in grey.</p>

  <form id="form">
    <fieldset>
      <legend>Connection</legend>
      <label>Home Assistant URL
        <input type="url" id="haUrl" placeholder="http://homeassistant.local:8123" required>
      </label>
      <label>Long-lived access token
        <span class="hint">(Profile → Security → Long-lived access tokens)</span>
        <input type="password" id="token" autocomplete="off" required>
      </label>
    </fieldset>

    <fieldset>
      <legend>Playing a video</legend>
      <label>Play script
        <span class="hint">(started with the video ID when you pick "Play on TV")</span>
        <input type="text" id="scriptEntity">
      </label>
      <label>Video ID variable name
        <span class="hint">(the script field that receives the ID)</span>
        <input type="text" id="videoVariable">
      </label>
    </fieldset>

    <fieldset>
      <legend>TV &amp; popup controls</legend>
      <label>TV media player
        <span class="hint">(state, volume and mute in the popup)</span>
        <input type="text" id="tvEntity">
      </label>
      <label>Turn-on script
        <span class="hint">(type <code>-</code> to use media_player.turn_on instead)</span>
        <input type="text" id="onScript">
      </label>
      <label>Turn-off script
        <span class="hint">(type <code>-</code> to use media_player.turn_off instead)</span>
        <input type="text" id="offScript">
      </label>
      <label>Volume presets
        <span class="hint">(percent, comma-separated; <code>-</code> hides the preset buttons)</span>
        <input type="text" id="volumePresets">
      </label>
    </fieldset>

    <fieldset>
      <legend>Development</legend>
      <label class="check">
        <input type="checkbox" id="dryRun">
        Dry run: log requests to the console (service worker or popup) instead of sending them
      </label>
    </fieldset>

    <div class="buttons">
      <button type="submit" class="primary">Save</button>
      <button type="button" id="test">Test connection</button>
      <span class="spacer"></span>
      <button type="button" id="reset">Reset to defaults</button>
    </div>
    <div id="status"></div>
  </form>

  <script type="module" src="options.js"></script>
</body>
</html>
